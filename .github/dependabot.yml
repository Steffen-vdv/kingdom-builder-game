version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'friday'
      time: '06:00'
      timezone: 'UTC'
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
    ignore:
      - dependency-name: '@boardsmith/*'
    groups:
      testing-and-quality:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - '@testing-library/*'
          - 'fast-check'
          - 'jsdom'
      linting-and-formatting:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@typescript-eslint/*'
          - 'prettier'
      build-tooling:
        patterns:
          - 'vite'
          - '@vitejs/*'
          - 'tsx'
          - 'npm-run-all'
      css-pipeline:
        patterns:
          - 'tailwindcss'
          - 'postcss'
          - 'autoprefixer'
      react-stack:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
      day: 'monday'
      time: '06:00'
      timezone: 'UTC'
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
    ignore:
      # pnpm/action-setup v6 bootstraps the latest pnpm
      # (currently 11.0.0-rc.0) and `pnpm self-update <version>`
      # does not downgrade, leaving the v11 RC active. v11 RC
      # rejects builds even when packages are listed in
      # pnpm.onlyBuiltDependencies (ERR_PNPM_IGNORED_BUILDS).
      # Stay on v4 until v6 is fixed or pnpm 11 is stable.
      - dependency-name: 'pnpm/action-setup'
        versions: ['>=5']
