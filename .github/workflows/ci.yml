name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task: [format:check, typecheck, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - run: pnpm run ${{ matrix.task }}

  test-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - run: pnpm test:coverage:engine
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-engine
          path: coverage/

  test-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - run: pnpm test:coverage:protocol
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-protocol
          path: coverage/

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - run: pnpm test:integration
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: coverage/

  test-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node deps
        run: pnpm install --frozen-lockfile

      - name: Install Python deps (bashlex for shell parsing)
        run: pip install bashlex

      - name: Download crypto-gate binary
        run: |
          mkdir -p bin
          gh release download v0.5.0 \
            --repo anthropics/crypto-gate \
            --pattern "crypto-gate-linux-x64" \
            --dir bin
          chmod +x bin/crypto-gate-linux-x64
          ln -sf crypto-gate-linux-x64 bin/crypto-gate
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run infrastructure tests
        run: pnpm test:infrastructure
        env:
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - run: pnpm test:web

  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - run: pnpm test:coverage:server
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-server
          path: packages/server/coverage/

  build:
    runs-on: ubuntu-latest
    needs:
      - quality
      - test-engine
      - test-protocol
      - test-integration
      - test-infrastructure
      - test-web
      - test-server
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - run: pnpm build
